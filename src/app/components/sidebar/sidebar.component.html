<nav class="navbar" [ngClass]="currentTheme" [class.menu-open]="isSidebarOpen">
  <div class="nav-brand" (click)="scrollTo('home')">
    <div class="profile-image">
      <img [src]="profileImage" alt="Win Naing Soe" (error)="handleImageError($event)" #profileImg>
    </div>
    <div style="display: flex; flex-direction: column; justify-content: center;">
      <span class="brand-name" style="line-height: 1.2;">Win Naing Soe</span>
      <span class="greeting-text" style="font-size: 0.75rem; font-weight: 500; opacity: 0.8;">{{ getGreeting() }}</span>
    </div>
  </div>

  <button class="menu-toggle" (click)="toggleSidebar()">
    <mat-icon>{{ isSidebarOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

  <div class="nav-content" [class.show]="isSidebarOpen">
    <ul class="nav-links">
      <li>
        <a [class.active]="activeSection === 'home'" (click)="scrollTo('home')">Home</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'about'" (click)="scrollTo('about')">About</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'resume'" (click)="scrollTo('resume')">Career</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'education'" (click)="scrollTo('education')">Education</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'portfolio'" (click)="scrollTo('portfolio')">Portfolio</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'contact'" (click)="scrollTo('contact')">Contact</a>
      </li>
    </ul>

    <div class="theme-switcher">
      <button (click)="setTheme('theme-day')" [class.active]="currentTheme === 'theme-day'" title="Day Mode">☀️</button>
      <button (click)="setTheme('theme-twilight')" [class.active]="currentTheme === 'theme-twilight'" title="Twilight Mode">🌅</button>
      <button (click)="setTheme('theme-dark')" [class.active]="currentTheme === 'theme-dark'" title="Dark Mode">🌙</button>
    </div>

    <div class="social-links">
      <a href="https://github.com/winnaingsoe6666" target="_blank" class="social-item"><mat-icon svgIcon="github"></mat-icon></a>
      <a href="https://www.linkedin.com/in/win-naing-soe" target="_blank" class="social-item"><mat-icon svgIcon="linkedin"></mat-icon></a>
    </div>
  </div>
</nav>
